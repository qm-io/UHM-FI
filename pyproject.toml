[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhm-fi"
version = "0.1.0"
description = "Universal Hierarchical Modulation with Feature Interleaving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.30",
  "numpy>=1.24",
  "Pillow>=10",
  "pydicom>=2.4",
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.1",
  "pylibjpeg-openjpeg>=2.0",
  "pylibjpeg-rle>=2.0",
  "PyYAML>=6",
  "wandb==0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["uhm_fi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
