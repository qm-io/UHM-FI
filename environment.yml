name: uhm-fi

channels:
  - conda-forge

dependencies:
  - python=3.11.15
  - pip=26.1.2
  - setuptools=83.0.0
  - wheel=0.47.0
  - packaging=26.2
  - pip:
      # PyTorch's official CUDA 12.8 wheel index.  PyPI remains the primary
      # index for the non-PyTorch dependencies below.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - transformers==4.57.6
      - tokenizers==0.22.2
      - huggingface-hub==0.36.2
      - hf-xet==1.5.2
      - safetensors==0.8.0
      - numpy==2.4.4
      - Pillow==12.2.0
      - pydicom==3.0.2
      - pylibjpeg==2.1.0
      - pylibjpeg-libjpeg==2.4.0
      - pylibjpeg-openjpeg==2.5.0
      - pylibjpeg-rle==2.2.0
      - PyYAML==6.0.3
      - wandb==0.28.1
      - pytest==9.1.1
      - certifi==2026.7.22
      - charset-normalizer==3.4.9
      - filelock==3.29.0
      - fsspec==2026.4.0
      - idna==3.18
      - iniconfig==2.3.0
      - Jinja2==3.1.6
      - MarkupSafe==3.0.3
      - mpmath==1.3.0
      - networkx==3.6.1
      - pluggy==1.6.0
      - Pygments==2.20.0
      - regex==2026.7.19
      - requests==2.34.2
      - sympy==1.14.0
      - tqdm==4.70.0
      - triton==3.3.1
      - typing-extensions==4.15.0
      - urllib3==2.7.0

# Prevent global ROS/Isaac Lab Python paths and user-site packages from leaking
# into this project environment.
variables:
  PYTHONPATH: ""
  PYTHONNOUSERSITE: "1"
