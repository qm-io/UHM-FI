model_config: uhm_fi_resnet50.yaml
pretrained_checkpoint: ./output/pretrain_full_50epoch_20260731/best.pt
data:
  csv_path: ./data/downstream/cbis_ddsm_cls.csv
  image_column: path
  label_column: label
  split_column: split
  train_split: train
  validation_split: valid
  test_split: test
  train_fraction: 1.0
  enforce_disjoint_paths: true
  deduplicate_classification_paths: true
  image:
    resize: 256
    crop_size: 224
    horizontal_flip: 0.5
    normalize: half
  loader:
    batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  cache_path_column: cache_path
  cache_index_column: cache_index
task:
  type: classification
  num_classes: 1
  protocol: fine_tune
  feature_source: global_feature
optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 1.0e-06
scheduler:
  name: plateau
trainer:
  output_dir: ./output/downstream/cbis_cls_finetune
  epochs: 50
  device: cuda
  seed: 42
  amp: true
  gradient_clip: 0.25
  early_stopping_patience: 10
  log_every_steps: 50
